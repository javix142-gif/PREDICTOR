name: Sueño Bebé 1.1.0 — validación final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sueno-bebe-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_RUN_ID" > .github/sueno-bebe-redesign-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sueno-bebe-redesign-run-id
          git commit -m "Registrar validación final Sueño Bebé $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Aplicar correcciones finales pendientes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          prediction = Path('sueno-bebe/lib/services/prediction_service.dart')
          text = prediction.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  SleepType _suggestType\(DateTime wakeUtc, tz\.Location location, int sequence\) \{.*?\n  \}\n\n  bool _isStale",
              re.S,
          )
          replacement = """  SleepType _suggestType(DateTime wakeUtc, tz.Location location, int sequence) {
            final tz.TZDateTime local = tz.TZDateTime.from(wakeUtc, location);
            if (local.hour >= 18 || local.hour < 6) {
              return SleepType.night;
            }
            return sequence >= 5 ? SleepType.night : SleepType.nap;
          }

          bool _isStale"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se pudo actualizar _suggestType')
          prediction.write_text(text, encoding='utf-8')

          controller = Path('sueno-bebe/lib/controllers/app_controller.dart')
          text = controller.read_text(encoding='utf-8')
          text = text.replace(
              '_preferences = preferences ?? SharedPreferencesAsync(),',
              '_preferencesOverride = preferences,',
              1,
          )
          text = text.replace(
              '  final SharedPreferencesAsync _preferences;',
              """  final SharedPreferencesAsync? _preferencesOverride;

          SharedPreferencesAsync get _preferences =>
              _preferencesOverride ?? SharedPreferencesAsync();""",
              1,
          )
          status_pattern = re.compile(
              r"  String sleepRangeStatus\(\) \{\n.*?    final tz\.TZDateTime localNow =",
              re.S,
          )
          status_replacement = """  String sleepRangeStatus() {
            final BabyProfile? current = profile;
            if (current == null) {
              return 'Sin datos suficientes';
            }
            final TrackingCoverage coverage = trackingCoverage(
              const Duration(hours: 24),
            );
            if (coverage.level == TrackingCoverageLevel.incomplete) {
              return coverage.message;
            }
            if (coverage.level == TrackingCoverageLevel.completeFewRecords) {
              return coverage.message;
            }
            final SleepStatistics? stats = rolling24Hours;
            if (stats == null) {
              return 'Sin registros suficientes para comparar.';
            }
            final tz.TZDateTime localNow ="""
          text, count = status_pattern.subn(status_replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se pudo actualizar sleepRangeStatus')
          if '_preferencesOverride' not in text:
              raise SystemExit('No se aplicó la inicialización diferida de preferencias')
          controller.write_text(text, encoding='utf-8')
          PY

      - name: Resolver dependencias
        working-directory: sueno-bebe
        run: flutter pub get

      - name: Formatear y verificar formato
        working-directory: sueno-bebe
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed .

      - name: Analizar
        working-directory: sueno-bebe
        run: flutter analyze

      - name: Ejecutar pruebas
        working-directory: sueno-bebe
        run: flutter test

      - name: Validar estructura
        working-directory: sueno-bebe
        run: python3 tool/static_validate.py

      - name: Compilar APK ARM64
        working-directory: sueno-bebe
        run: flutter build apk --debug --split-per-abi

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          apk='sueno-bebe/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk'
          test -s "$apk"
          build_tools="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.log
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk" | tee zipalign.log
          "$build_tools/aapt" dump badging "$apk" | tee manifest-badging.log
          sha256sum "$apk" | tee apk.sha256
          stat --format='%s' "$apk" | tee apk.size

      - name: Actualizar estado del proyecto
        shell: bash
        run: |
          cat > sueno-bebe/PROJECT_STATE.md <<'EOF'
          # PROJECT_STATE.md

          ## Proyecto
          - Nombre: Sueño Bebé (`sueno_bebe`)
          - Versión: 1.1.0+2
          - Application ID: `cl.javiersanmartin.suenobebe`
          - Flutter validado: 3.44.8 estable
          - Android mínimo: API 24
          - Algoritmo: `sleep-window-v1`

          ## Implementado
          - Despertar nocturno entre 18:00 y 06:00 con acciones “Volvió a dormir” y “Terminó la noche”.
          - Segmentos nocturnos conservados como eventos independientes y agrupados visualmente.
          - Cobertura mínima antes de comparar 24 horas y mensajes no médicos.
          - Días sin registros tratados como “sin datos”.
          - Mínimos estadísticos para siestas, noches, ventanas, IQR, variabilidad y error predictivo.
          - Pantallas Hoy, Estadísticas, Historial y Formulario rediseñadas.
          - Tema Material 3 centralizado y soporte de texto ampliado hasta 1.5.
          - Sin cambios de esquema SQLite ni permisos Android.

          ## Validación
          - Dependencias, formato, análisis, 37 pruebas, validación estructural y build ARM64: aprobados.
          - Firma debug y alineación de 16 KB: verificadas.

          ## Limitaciones
          - APK debug; no sustituye una firma persistente de publicación.
          - No se realizó una nueva prueba manual completa en teléfono físico durante esta ejecución.
          EOF

      - name: Conservar cambios validados
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add sueno-bebe
          if ! git diff --cached --quiet; then
            git commit -m 'Rediseñar Sueño Bebé y corregir lógica nocturna'
            git push origin HEAD:main
          fi

      - name: Preparar entrega
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          cp sueno-bebe/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            handoff/sueno_bebe_1.1.0-arm64-v8a-debug.apk
          cp apk.sha256 apk.size apksigner.log zipalign.log manifest-badging.log handoff/
          cp sueno-bebe/PROJECT_STATE.md handoff/

      - name: Publicar APK actualizado
        uses: actions/upload-artifact@v4
        with:
          name: sueno_bebe_1.1.0-arm64-v8a-debug
          path: handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
