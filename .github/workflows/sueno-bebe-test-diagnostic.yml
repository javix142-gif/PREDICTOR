name: Sueño Bebé diagnóstico de pruebas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sueno-bebe-test-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución diagnóstica
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_RUN_ID" > .github/sueno-bebe-diag-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sueno-bebe-diag-run-id
          git commit -m "Registrar diagnóstico de pruebas $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolver dependencias
        working-directory: sueno-bebe
        run: flutter pub get

      - name: Probar validación de eventos
        working-directory: sueno-bebe
        run: flutter test test/sleep_event_validation_test.dart

      - name: Probar estadísticas
        working-directory: sueno-bebe
        run: flutter test test/statistics_service_test.dart

      - name: Probar predicciones
        working-directory: sueno-bebe
        run: flutter test test/prediction_service_test.dart
