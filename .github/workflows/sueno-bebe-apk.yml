name: Sueño Bebé APK

on:
  push:
    branches: [main]
    paths:
      - 'sueno-bebe/**'
      - '.github/workflows/sueno-bebe-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar identificador de ejecución
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/sueno-bebe-ci
          echo "$GITHUB_RUN_ID" > .github/sueno-bebe-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sueno-bebe-run-id
          git commit -m "Registrar ejecución Sueño Bebé $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.44.8 estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Verificar versiones
        shell: bash
        run: |
          set -o pipefail
          {
            flutter --version
            dart --version
            java -version
          } 2>&1 | tee .github/sueno-bebe-ci/versions.log

      - name: Restaurar Gradle Wrapper faltante
        shell: bash
        working-directory: sueno-bebe
        run: |
          set -euo pipefail
          wrapper='android/gradle/wrapper/gradle-wrapper.jar'
          if [ ! -s "$wrapper" ]; then
            curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar' \
              --output "$wrapper"
          fi
          test -s "$wrapper"
          jar tf "$wrapper" >/dev/null

      - name: Resolver dependencias Flutter
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../.github/sueno-bebe-ci/pub-get.log

      - name: Aplicar formato oficial y conservar archivos generados
        shell: bash
        run: |
          set -euo pipefail
          dart format sueno-bebe/lib sueno-bebe/test 2>&1 | tee .github/sueno-bebe-ci/format-apply.log
          git add sueno-bebe/lib sueno-bebe/test sueno-bebe/pubspec.lock sueno-bebe/android/gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Aplicar formato Dart y completar archivos de compilación'
            git push origin HEAD:main
          fi

      - name: Verificar formato Dart
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed . 2>&1 | tee ../.github/sueno-bebe-ci/format.log

      - name: Ejecutar análisis estático
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../.github/sueno-bebe-ci/analyze.log

      - name: Ejecutar pruebas
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../.github/sueno-bebe-ci/test.log

      - name: Compilar APK debug
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../.github/sueno-bebe-ci/build.log

      - name: Verificar APK y firma
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"
          sha256sum "$apk" | tee ../.github/sueno-bebe-ci/apk-sha256.log
          stat --format='Tamaño: %s bytes' "$apk" | tee ../.github/sueno-bebe-ci/apk-size.log
          apksigner_path="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$apksigner_path" ]; then
            "$apksigner_path" verify --verbose --print-certs "$apk" 2>&1 | tee ../.github/sueno-bebe-ci/apksigner.log
          else
            echo 'apksigner no disponible en el runner' | tee ../.github/sueno-bebe-ci/apksigner.log
          fi

      - name: Registrar resultados de diagnóstico
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\njob_status=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "${{ job.status }}" "$GITHUB_SHA" > .github/sueno-bebe-ci/status.txt
          git add .github/sueno-bebe-ci
          if ! git diff --cached --quiet; then
            git commit -m "Registrar diagnóstico Sueño Bebé $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi

      - name: Publicar únicamente APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sueno-bebe-1.0.0-debug
          path: sueno-bebe/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
