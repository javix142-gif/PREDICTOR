name: Sueño Bebé APK

on:
  push:
    branches: [main]
    paths:
      - 'sueno-bebe/**'
      - '.github/workflows/sueno-bebe-apk.yml'
      - '.github/bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Materializar proyecto adjunto
        if: ${{ hashFiles('.github/bootstrap/source.b64.part*') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/source.b64.part* | base64 --decode > /tmp/sueno_bebe_source.tar.xz
          echo '2e0e84ca8bf4d61c2959d880858093970c55a3cf9a1e7fd0342b16a648e305e3  /tmp/sueno_bebe_source.tar.xz' | sha256sum --check --strict
          rm -rf sueno-bebe
          mkdir -p sueno-bebe
          tar -xJf /tmp/sueno_bebe_source.tar.xz -C sueno-bebe
          chmod +x sueno-bebe/android/gradlew
          test -s sueno-bebe/pubspec.yaml
          test -d sueno-bebe/lib
          test -d sueno-bebe/android
          test -d sueno-bebe/test

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.44.8 estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Verificar versiones
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version

      - name: Restaurar Gradle Wrapper faltante
        shell: bash
        working-directory: sueno-bebe
        run: |
          set -euo pipefail
          wrapper='android/gradle/wrapper/gradle-wrapper.jar'
          if [ ! -s "$wrapper" ]; then
            curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar' \
              --output "$wrapper"
          fi
          test -s "$wrapper"
          jar tf "$wrapper" >/dev/null

      - name: Conservar proyecto materializado en GitHub
        if: ${{ hashFiles('.github/bootstrap/source.b64.part*') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sueno-bebe .github/bootstrap
          if ! git diff --cached --quiet; then
            git commit -m 'Importar proyecto Flutter Sueño Bebé'
            git push origin HEAD:main
          fi

      - name: Resolver dependencias Flutter
        working-directory: sueno-bebe
        run: flutter pub get

      - name: Verificar formato Dart
        working-directory: sueno-bebe
        run: dart format --output=none --set-exit-if-changed .

      - name: Ejecutar análisis estático
        working-directory: sueno-bebe
        run: flutter analyze

      - name: Ejecutar pruebas
        working-directory: sueno-bebe
        run: flutter test

      - name: Compilar APK debug
        working-directory: sueno-bebe
        run: flutter build apk --debug

      - name: Verificar APK y firma
        working-directory: sueno-bebe
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"
          sha256sum "$apk"
          stat --format='Tamaño: %s bytes' "$apk"
          apksigner_path="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$apksigner_path" ]; then
            "$apksigner_path" verify --verbose --print-certs "$apk"
          else
            echo 'apksigner no disponible en el runner'
          fi

      - name: Publicar únicamente APK debug
        uses: actions/upload-artifact@v4
        with:
          name: sueno-bebe-1.0.0-debug
          path: sueno-bebe/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
