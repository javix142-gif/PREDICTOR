name: Verificar instalación Sueño Bebé

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sueno-bebe-device-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_RUN_ID" > .github/sueno-bebe-device-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sueno-bebe-device-run-id
          git commit -m "Registrar verificación Android Sueño Bebé $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolver dependencias
        working-directory: sueno-bebe
        run: flutter pub get

      - name: Verificar formato
        working-directory: sueno-bebe
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        working-directory: sueno-bebe
        run: flutter analyze

      - name: Probar
        working-directory: sueno-bebe
        run: flutter test

      - name: Compilar APK separados por arquitectura
        working-directory: sueno-bebe
        run: flutter build apk --debug --split-per-abi

      - name: Verificar firma, alineación y manifiesto
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          report='.github/sueno-bebe-device-report.txt'
          : > "$report"
          for apk in sueno-bebe/build/app/outputs/flutter-apk/app-*-debug.apk; do
            echo "===== $apk =====" | tee -a "$report"
            "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee -a "$report"
            "$zipalign" -c -P 16 -v 4 "$apk" 2>&1 | tee -a "$report"
            "$aapt" dump badging "$apk" 2>&1 | tee -a "$report"
            sha256sum "$apk" | tee -a "$report"
            stat --format='size=%s' "$apk" | tee -a "$report"
          done

      - name: Instalar y abrir en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            apk='sueno-bebe/build/app/outputs/flutter-apk/app-x86_64-debug.apk'
            adb install -r "$apk" | tee .github/sueno-bebe-adb-install.txt
            adb shell am start -W -n cl.javiersanmartin.suenobebe/.MainActivity | tee .github/sueno-bebe-adb-start.txt
            sleep 5
            adb shell pidof cl.javiersanmartin.suenobebe | tee .github/sueno-bebe-adb-pid.txt
            test -s .github/sueno-bebe-adb-pid.txt

      - name: Preparar entrega arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          source_apk='sueno-bebe/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk'
          target_apk='handoff/sueno_bebe_1.0.0-arm64-v8a-debug.apk'
          cp "$source_apk" "$target_apk"
          test -s "$target_apk"
          sha256sum "$target_apk" | tee handoff/SHA256.txt
          stat --format='%s' "$target_apk" | tee handoff/SIZE.txt
          cp .github/sueno-bebe-device-report.txt handoff/VERIFICACION_ANDROID.txt
          cp .github/sueno-bebe-adb-install.txt handoff/ADB_INSTALL.txt
          cp .github/sueno-bebe-adb-start.txt handoff/ADB_START.txt

      - name: Publicar APK arm64 verificado
        uses: actions/upload-artifact@v4
        with:
          name: sueno_bebe_1.0.0-arm64-v8a-debug
          path: handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
