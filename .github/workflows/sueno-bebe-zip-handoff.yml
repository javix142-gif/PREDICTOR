name: Sueño Bebé APK ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sueno-bebe-zip-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_RUN_ID" > .github/sueno-bebe-zip-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/sueno-bebe-zip-run-id
          git commit -m "Registrar ZIP APK Sueño Bebé $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.44.8 estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolver dependencias
        working-directory: sueno-bebe
        run: flutter pub get

      - name: Corregir const inválidos y conservar cambios
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/return const Scaffold(/return Scaffold(/' sueno-bebe/lib/app.dart
          sed -i 's/throw const StateError(/throw StateError(/g' sueno-bebe/lib/controllers/app_controller.dart
          dart format sueno-bebe/lib/app.dart sueno-bebe/lib/controllers/app_controller.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sueno-bebe/lib/app.dart sueno-bebe/lib/controllers/app_controller.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Corregir constructores no constantes de Sueño Bebé'
            git push origin HEAD:main
          fi

      - name: Verificar formato
        working-directory: sueno-bebe
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        working-directory: sueno-bebe
        run: flutter analyze

      - name: Probar
        working-directory: sueno-bebe
        run: flutter test

      - name: Compilar APK debug
        working-directory: sueno-bebe
        run: flutter build apk --debug

      - name: Preparar APK con nombre final
        shell: bash
        run: |
          set -euo pipefail
          source_apk='sueno-bebe/build/app/outputs/flutter-apk/app-debug.apk'
          target_apk='handoff/sueno_bebe_1.0.0-debug.apk'
          test -s "$source_apk"
          mkdir -p handoff
          cp "$source_apk" "$target_apk"
          test -s "$target_apk"
          sha256sum "$target_apk"
          stat --format='Tamaño: %s bytes' "$target_apk"

      - name: Publicar ZIP con APK
        uses: actions/upload-artifact@v4
        with:
          name: sueno_bebe_1.0.0-debug
          path: handoff/sueno_bebe_1.0.0-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
