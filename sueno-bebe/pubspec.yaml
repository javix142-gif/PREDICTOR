name: sueno_bebe
description: Aplicación local para registrar, analizar y predecir estadísticamente el sueño infantil.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
